openapi: 3.1.0

info:
  title: AksesCheck ID API
  version: 0.1.0
  description: API untuk pemindaian aksesibilitas website.

servers:
  - url: http://localhost:8080/api/v1

paths: {}

components:
  schemas:
    ScanStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled

    Scan:
      type: object
      required:
        - id
        - url
        - status
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/ScanStatus"
