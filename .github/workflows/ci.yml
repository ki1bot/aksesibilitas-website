name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Display Go version
        run: go version

      - name: Download Go dependencies
        run: go mod download

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.0"

      - name: Display sqlc version
        run: sqlc version

      - name: Generate sqlc package
        run: sqlc generate

      - name: Verify generated sqlc files
        run: git diff --exit-code -- internal/database/sqlcgen

      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"

          if [ -n "$unformatted" ]; then
            echo "File Go berikut belum diformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Display Go coverage
        run: go tool cover -func=coverage.out

  web:
    name: Web validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_CSRF_COOKIE_NAME: aksesibilitaswebsite_session_csrf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Display tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize axe-core
        run: pnpm sync:axe

      - name: Verify synchronized axe-core
        run: git diff --exit-code -- embedded/axe.min.js

      - name: Generate OpenAPI types
        run: pnpm generate:api

      - name: Verify generated OpenAPI types
        run: git diff --exit-code -- apps/web/src/lib/api/schema.d.ts

      - name: Run ESLint
        run: pnpm lint:web

      - name: Run TypeScript validation
        run: pnpm typecheck:web

      - name: Build Next.js
        run: pnpm build:web
